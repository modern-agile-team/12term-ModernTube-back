# .github/workflows/sync-issue-to-pr.yml
name: Sync Issue Checklist to PR

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 이슈 번호 추출 후 PR 본문에 체크리스트 반영
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || "";
            const match = prBody.match(/#(\d+)/);

            if (!match) {
              console.log("PR 본문에서 이슈 번호(#숫자)를 찾지 못했습니다.");
              return;
            }

            const issueNumber = match[1];

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const newBody = `${prBody}\n\n---\n## 📋 연결된 이슈 (#${issueNumber}) 체크리스트\n\n${issue.body}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: newBody
            });